name: CI

# Runs on every push and pull request. The release job deliberately does NOT
# sign anything — it builds with -PallowDebugSignedRelease=true purely to
# prove the release variant compiles, minifies and lints. Producing a shippable
# artifact is a separate, credentialed job that does not live in a file
# visible to forks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: dependency verification and the secret scan both need
          # it, and a shallow clone would hide a leaked key in an old commit.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # android-actions/setup-android@v3 was removed. With no `packages:`
      # input it installs the legacy `tools` package, which Google has deleted
      # from the SDK repository, so `sdkmanager` exits 1 and the job dies in
      # ~15s before any Gradle step runs. That failed every run in this repo's
      # history, including the ones with no relation to this change. The
      # GitHub-hosted ubuntu image already ships the Android SDK, the
      # cmdline-tools and accepted licenses, and AGP downloads anything else
      # the build needs (compileSdk 37) on demand. Re-add a setup action only
      # with an explicit `packages:` list that still exists upstream.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # No `google-services.json` and no keystore.properties in CI, by design.
      # The build degrades gracefully (no FCM receive, debug-signed release) so
      # a clean checkout compiles without any secret being present.
      # Design-system gate (docs/DESIGN_SYSTEM.md §Enforcement gate).
      # verifyDesignTokens fails on Color(0x…, raw .dp/.sp outside ui/theme,
      # or a bare Scaffold outside ui/components/PvScaffold.kt. This used to
      # be a bash one-liner in a document that nobody ran.
      # verifyDesignComponents is the second half of the same gate: no raw
      # Material widget and no spacing arithmetic inside a screen file, so a
      # new screen cannot quietly reintroduce Button( / Surface( / 13.dp.
      # verifyDesignShapes is the third: {rounded.pill} is legal only in the
      # five component files that are buttons or tag pills, so a selection
      # group or nav indicator cannot come back as a row of bubbles.
      - name: Design system gate
        run: ./gradlew verifyDesignTokens verifyDesignComponents verifyDesignShapes --stacktrace

      - name: Test (JVM)
        run: ./gradlew testDebugUnitTest --stacktrace

      # Screenshot baselines for the shared component library
      # (app/src/screenshotTestDebug/reference). Renders the same @Preview
      # functions the IDE shows, host-side, and diffs against the committed
      # images. Regenerate with `./gradlew updateDebugScreenshotTest`.
      - name: Screenshot baselines
        run: ./gradlew validateDebugScreenshotTest --stacktrace

      - name: Lint (release)
        run: ./gradlew lintRelease --stacktrace

      # Dependency verification is enforced by gradle/verification-metadata.xml.
      # --offline proves the committed checksums are complete: a build that
      # needed an unlisted artifact fails here rather than silently widening
      # trust on a developer's machine.
      - name: Release build (dependency verification, offline)
        run: >-
          ./gradlew assembleRelease
          -PallowDebugSignedRelease=true
          --offline
          --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/outputs/androidTest-results/**
          retention-days: 14

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans every commit, not just the working tree: a key leaked and later
      # removed is still in the history and still needs rotating.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # Fail rather than warn. A detected credential means it must be
          # rotated, and that is a human decision made under pressure.
          GITLEAKS_EXIT_CODE: '1'
